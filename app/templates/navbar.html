<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-3">
  <div class="container">
    <a class="navbar-brand fw-bold text-teal d-flex align-items-center gap-2" href="/">
      <i class="bi bi-compass-fill fs-3 text-teal"></i>
      <span>TravelCraft</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
        <li class="nav-item"><a class="nav-link fw-medium" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link fw-medium" href="/plan">Plan Trip</a></li>
        <li class="nav-item"><a class="nav-link fw-medium" href="/my-trips">My Trips</a></li>
      </ul>
      
      <!-- Session Cookie Check via Flask Jinja -->
      <div class="d-flex gap-2 align-items-center" id="navAuthSection">
        {% if session.get('user_id') %}
          <!-- USER IS LOGGED IN VIA COOKIE -->
          <div class="dropdown">
            <button class="btn btn-light border btn-sm dropdown-toggle d-flex align-items-center gap-2 py-2 px-3 rounded-pill" type="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle text-teal fs-5"></i>
              <span class="fw-semibold text-dark">{{ session.get('user_name', 'My Account') }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 rounded-3">
              <li class="px-3 py-2 border-bottom">
                <small class="text-muted d-block">Signed in as</small>
                <strong class="text-dark small">{{ session.get('user_email', '') }}</strong>
              </li>
              <li><a class="dropdown-item py-2" href="/my-trips"><i class="bi bi-compass me-2 text-teal"></i>My Trips</a></li>
              <li><a class="dropdown-item py-2" href="/plan"><i class="bi bi-plus-circle me-2 text-teal"></i>Plan New Trip</a></li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item py-2 text-danger" onclick="logoutSession()">
                  <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                </button>
              </li>
            </ul>
          </div>
        {% else %}
          <!-- GUEST USER -->
          <a href="/login" class="btn btn-outline-secondary btn-sm px-3">Sign In</a>
          <a href="/signup" class="btn btn-teal btn-sm px-3">Get Started</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<script>
  async function logoutSession() {
    try {
      await fetch('/api/auth/logout', { method: 'POST' });
      // Clear any legacy localStorage
      localStorage.clear();
      window.location.href = '/';
    } catch (e) {
      window.location.href = '/';
    }
  }
</script>
