<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - TravelCraft</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include 'navbar.html' %}

  <main class="d-flex align-items-center py-5">
    <div class="container" style="max-width: 440px;">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-person-plus-fill fs-1 text-teal"></i>
          <h3 class="fw-bold mt-2">Create Account</h3>
          <p class="text-muted small">Start planning customized trips today</p>
        </div>

        <form id="signupFormPage" onsubmit="handleSignup(event)">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name</label>
            <input type="text" id="regName" class="form-control" required placeholder="Alex Morgan">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email</label>
            <input type="email" id="regEmail" class="form-control" required placeholder="alex@example.com">
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" id="regPassword" class="form-control" required placeholder="At least 6 characters">
          </div>
          <button type="submit" class="btn btn-teal w-100 py-2">Create Account</button>
        </form>

        <div class="text-center mt-4">
          <small class="text-muted">Already have an account? <a href="/login" class="text-teal fw-semibold">Sign In</a></small>
        </div>
      </div>
    </div>
  </main>

  {% include 'footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
